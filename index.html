<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>peopleperson · dashboard</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23999'/%3E%3C/svg%3E"><style>body{margin:0;color:#111;background:#fff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:15px 20px;border-bottom:1px solid #e8e8e8;font-weight:600}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#aaa;margin-right:8px}main{max-width:380px;margin:12vh auto;padding:24px}h1{font-size:23px;letter-spacing:-.02em}p{color:#666;font-size:14px;line-height:1.6}form{border:1px solid #e8e8e8;border-radius:14px;padding:20px;margin-top:24px}label{font-size:14px;display:block}input{box-sizing:border-box;width:100%;font:inherit;padding:11px;margin:9px 0 16px;border:1px solid #d8d8d8;background:#fafafa;border-radius:9px}button{font:inherit;font-size:14px;border:0;border-radius:9px;background:#111;color:white;padding:11px 16px;cursor:pointer}button:disabled{opacity:.5}.error{color:#333}input:focus-visible,button:focus-visible{outline:2px solid #111;outline-offset:3px}</style></head><body><header><span class="dot"></span>peopleperson</header><main><h1>pixel dashboard</h1><p>Enter the shared password to view campaign performance.</p><form id="unlock"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button>Open dashboard</button><p id="error" class="error" role="alert" hidden></p></form></main><script>
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button'),error=document.getElementById('error');button.disabled=true;button.textContent='Opening…';error.hidden=true;try{const response=await fetch('payload.json',{cache:'no-store'});if(!response.ok)throw Error('load');const payload=await response.json();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);let decoded;try{decoded=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));}catch{throw Error('password');}document.open();document.write(new TextDecoder().decode(decoded));document.close();}catch(err){error.textContent=err.message==='password'?'Incorrect password. Please try again.':'Could not open the dashboard. Please reload and try again.';error.hidden=false;button.disabled=false;button.textContent='Open dashboard';}});
</script></body></html>
